<!DOCTYPE html>
<html lang="fr" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SYS-NET STUDIO — Formateur IT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<style>
:root {
  --void: #020509; --deep: #050d18; --hull: #091525; --plate: #0d1e33;
  --grid: #122540; --wire: #1a3455; --cyan: #00e5ff; --cyan-dim: rgba(0, 229, 255, 0.15);
  --cyan-glow: rgba(0, 229, 255, 0.35); --neon: #00ff9d; --text: #b8d4f0;
  --text-bright: #e8f4ff; --text-dim: #4a6b8a; --danger: #ff3366;
  --font-display: 'Orbitron', monospace; --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif; --r: 6px; --r-lg: 12px;
  --border: 1px solid var(--wire); --border-cyan: 1px solid rgba(0,229,255,0.3);
  --transition: all 0.2s ease; --hud-border: 1px solid rgba(0,229,255,0.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--wire); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font-body); background: var(--void); color: var(--text); display: flex; flex-direction: column; }

/* HEADER */
#sysnet-header {
  position: sticky; top: 0; z-index: 100; background: rgba(5, 13, 24, 0.95);
  border-bottom: var(--hud-border); backdrop-filter: blur(20px); padding: 0 20px;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
}
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 900; letter-spacing: 4px; color: var(--text-bright); text-shadow: 0 0 20px rgba(0,229,255,0.5); }
.brand-sub { font-family: var(--font-mono); font-size: 9px; color: var(--cyan); letter-spacing: 3px; margin-top: 2px; opacity: 0.7; }

.header-controls { display: flex; align-items: center; gap: 8px; }
.hud-select { background: var(--hull); border: var(--hud-border); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius: var(--r); outline: none; }
.hud-btn { background: var(--hull); border: var(--hud-border); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: var(--r); cursor: pointer; transition: var(--transition); }
.hud-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.hud-btn.primary { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.5); color: var(--cyan); font-weight: 600; }

.status-pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; padding: 5px 10px; border-radius: 20px; background: var(--hull); border: var(--hud-border); color: var(--text-dim); }
.status-pill.active { border-color: rgba(0,255,157,0.4); color: var(--neon); background: rgba(0, 255, 157, 0.12); }

/* CHAT AREA (Centré) */
#chat-container { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; max-width: 1000px; margin: 0 auto; width: 100%; }
.message { max-width: 85%; padding: 14px 18px; border-radius: var(--r-lg); line-height: 1.65; position: relative; }
.message.user { align-self: flex-end; background: rgba(0,229,255,0.1); border: var(--border-cyan); color: var(--text-bright); }
.message.assistant { align-self: flex-start; background: var(--hull); border: var(--border); border-left: 2px solid rgba(0,229,255,0.3); }
.msg-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 6px; }

/* ACTIONS MESSAGES */
.msg-actions { margin-top: 10px; display: flex; gap: 8px; border-top: 1px solid var(--grid); padding-top: 8px; }
.action-btn { background: none; border: 1px solid var(--wire); color: var(--text-dim); font-family: var(--font-mono); font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
.action-btn:hover { color: var(--cyan); border-color: var(--cyan); }

/* QUICK PROMPTS */
#quick-prompts { background: rgba(5, 13, 24, 0.95); padding: 10px 16px; display: flex; gap: 10px; overflow-x: auto; border-top: var(--hud-border); justify-content: center; }
.quick-btn { background: var(--hull); border: 1px solid var(--wire); color: var(--cyan); font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap; transition: var(--transition); }
.quick-btn:hover { border-color: var(--cyan); background: var(--cyan-dim); }

/* INPUT AREA (Centré et Large) */
#input-container { background: rgba(5,13,24,0.95); border-top: 1px solid rgba(0,229,255,0.1); padding: 16px; }
#file-preview-bar { display: none; background: var(--hull); border: var(--border); padding: 8px 12px; margin: 0 auto 12px auto; border-radius: var(--r); justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-bright); max-width: 900px; width: 100%; }
#input-area { display: flex; gap: 12px; align-items: flex-end; max-width: 900px; margin: 0 auto; width: 100%; }
#file-upload-btn { background: var(--hull); border: var(--hud-border); color: var(--cyan); font-size: 18px; width: 48px; height: 48px; border-radius: var(--r-lg); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#user-input { flex: 1; background: var(--hull); border: var(--hud-border); color: var(--text-bright); font-family: var(--font-body); font-size: 14px; padding: 14px 16px; border-radius: var(--r-lg); resize: vertical; min-height: 60px; max-height: 300px; outline: none; }
#send-btn { background: rgba(0,229,255,0.2); border: var(--border-cyan); color: var(--cyan); font-family: var(--font-display); font-weight: 700; padding: 0 24px; border-radius: var(--r-lg); cursor: pointer; height: 48px; transition: var(--transition); }
#send-btn:hover:not(:disabled) { background: rgba(0,229,255,0.3); box-shadow: 0 0 15px var(--cyan-glow); }

/* ARCHIVES PANEL */
#archives-btn { position: fixed; left: 20px; top: 80px; z-index: 200; width: 46px; height: 46px; border-radius: 50%; background: var(--hull); border: var(--hud-border); color: var(--cyan); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
#archives-btn:hover { box-shadow: 0 0 15px var(--cyan-glow); }
#archives-panel { position: fixed; left: 20px; top: 140px; width: 320px; background: rgba(9,21,37,0.98); border: var(--hud-border); border-radius: var(--r-lg); z-index: 199; backdrop-filter: blur(20px); transform: translateX(calc(-100% - 40px)); transition: transform 0.3s ease; display: flex; flex-direction: column; max-height: 60vh; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
#archives-panel.active { transform: translateX(0); }
.archives-header { padding: 12px 16px; border-bottom: var(--border); display: flex; justify-content: space-between; align-items: center; }
.archives-header h3 { font-family: var(--font-display); font-size: 12px; color: var(--cyan); margin: 0; letter-spacing: 2px; }
.archives-list { overflow-y: auto; flex: 1; padding: 8px 0; }
.archive-item { padding: 10px 16px; border-bottom: 1px solid var(--grid); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.archive-item:hover { background: var(--hull); }
.archive-item-title { font-size: 12px; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.archive-item-date { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.archive-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; opacity: 0.5; }
.archive-delete:hover { opacity: 1; }

/* BARRE DE RECHERCHE ARCHIVES (Nouveau) */
.archives-search-container { padding: 10px 16px; border-bottom: 1px solid var(--grid); background: var(--deep); display: flex; gap: 8px; }
#archives-search-input { flex: 1; background: var(--hull); border: 1px solid var(--wire); color: var(--text-bright); border-radius: var(--r); padding: 6px 10px; font-size: 12px; outline: none; }
#archives-search-input:focus { border-color: var(--cyan); }
#btn-search-archive { background: none; border: 1px solid var(--wire); color: var(--cyan); border-radius: var(--r); padding: 0 8px; cursor: pointer; font-size: 12px; transition: 0.2s; }
#btn-search-archive:hover { background: var(--cyan-dim); }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(2,5,9,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--deep); border: var(--hud-border); border-radius: var(--r-lg); width: 100%; max-width: 500px; padding: 24px; }
.field-input { width: 100%; background: var(--hull); border: var(--hud-border); color: var(--text-bright); padding: 11px 14px; border-radius: var(--r); outline: none; margin-bottom: 16px; margin-top: 8px;}
.btn-primary { background: rgba(0,229,255,0.2); border: var(--border-cyan); color: var(--cyan); padding: 10px 20px; border-radius: var(--r); cursor: pointer; width: 100%; font-family: var(--font-display); }

.welcome-banner { align-self: center; text-align: center; padding: 28px 20px; max-width: 550px; }
.welcome-banner .wv-logo { font-family: var(--font-display); font-size: 36px; font-weight: 900; letter-spacing: 6px; color: var(--text-bright); margin-bottom: 8px; }
.welcome-banner .wv-sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 4px; color: var(--cyan); opacity: 0.7; margin-bottom: 20px; }

/* TOASTS */
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--deep); border: var(--hud-border); color: var(--text); padding: 11px 16px; border-radius: var(--r); font-family: var(--font-mono); font-size: 12px; }
.toast.success { border-left: 2px solid var(--neon); }
.toast.error { border-left: 2px solid var(--danger); }
</style>
</head>
<body>

<header id="sysnet-header">
  <div class="brand">
    <div>
      <div class="brand-name">SYS-NET STUDIO</div>
      <div class="brand-sub">IT TRAINER PLATFORM</div>
    </div>
  </div>
  <div class="header-controls">
    <select class="hud-select" id="model-select"></select>
    <button class="hud-btn" id="clear-chat">⌫ NOUVEAU CHAT</button>
  </div>
  <div class="header-controls">
    <span class="status-pill" id="api-status">OFFLINE</span>
    <button class="hud-btn primary" id="open-api-modal">🔑 CLÉ API</button>
  </div>
</header>

<main id="chat-container"></main>

<div id="quick-prompts">
  <button class="quick-btn" onclick="insertPrompt('tp')">⚡ TP Complet</button>
  <button class="quick-btn" onclick="insertPrompt('qcm')">📝 Générer QCM</button>
  <button class="quick-btn" onclick="insertPrompt('config')">⚙️ Script Config</button>
  <button class="quick-btn" onclick="insertPrompt('cours')">📘 Cours & TP Complet</button>
</div>

<div id="input-container">
  <div id="file-preview-bar"></div>
  <div id="input-area">
    <button id="file-upload-btn" title="Joindre un fichier">📎</button>
    <input type="file" id="file-input" style="display:none">
    <textarea id="user-input" placeholder="Transmettez votre message…" rows="1"></textarea>
    <button id="send-btn">ENVOYER ▶</button>
  </div>
</div>

<button id="archives-btn" title="Historique">🗂️</button>
<div id="archives-panel">
  <div class="archives-header">
    <h3>ARCHIVES</h3>
    <button class="hud-btn" onclick="newChat()">+ Nouveau</button>
  </div>
  <div class="archives-search-container">
    <input type="text" id="archives-search-input" placeholder="Rechercher (ex: OSPF)...">
    <button id="btn-search-archive">🔍</button>
  </div>
  <div class="archives-list" id="archives-list"></div>
</div>

<div class="modal-overlay" id="api-modal">
  <div class="modal-box">
    <h3 style="font-family: var(--font-display); color: var(--cyan);">🔑 CLÉ API MISTRAL</h3>
    <input type="password" class="field-input" id="api-key-input" placeholder="Collez votre clé ici…">
    <button class="btn-primary" id="save-api-key">💾 ENREGISTRER</button>
    <button class="hud-btn" id="close-api-modal" style="width: 100%; margin-top: 10px;">Annuler</button>
  </div>
</div>

<div class="modal-overlay" id="editor-modal">
  <div class="modal-box" style="max-width: 900px; width: 90%; height: 85vh; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="font-family: var(--font-display); color: var(--cyan); margin: 0;">📝 ÉDITEUR DE DOCUMENT</h3>
      <button class="hud-btn" id="close-editor-modal">✕ Fermer</button>
    </div>
    <div id="editor-container" style="flex: 1; background: #ffffff; color: #000000; border-radius: 4px; overflow-y: auto; font-family: sans-serif; font-size: 15px; min-height: 300px;"></div>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button class="btn-primary" onclick="exportToWord()" style="flex: 1; font-weight: 600;">💾 Exporter en Word (.doc)</button>
      <button class="hud-btn" onclick="exportToHtml()" style="flex: 1; background: var(--hull);">🌐 Exporter en .html</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
const MODELS = [
  { id:"mistral-small-2603", name:"⚡ Mistral Small", temp:0.42 },
  { id:"mistral-large-2512", name:"🧠 Mistral Large", temp:0.48 },
  { id:"pixtral-large-2411", name:"👁️ Pixtral (Images)", temp:0.42 },
  { id:"open-mistral-nemo", name:"💻 Mistral Nemo", temp:0.42 }
];

const DB_NAME = "SYSNET_STUDIO_DB";
const DB_VERSION = 1;
let state = { apiKey: null, chatId: null, messages: [], model: "mistral-small-2603", attachedFile: null };

// Variables ajoutées pour la recherche et l'éditeur
let archiveSearchQuery = "";
let quillEditor;

const $ = s => document.querySelector(s);
const uuid = () => crypto.randomUUID();
const now = () => Date.now();
const escapeHtml = t => (t||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");

// Fonction sécurisée pour transformer le Markdown en HTML sans utiliser de backticks directs
function parseMarkdownToHtml(text) {
  if (!text) return "";
  let html = text.replace(/\n/g, '<br>');
  const t3 = String.fromCharCode(96, 96, 96);
  const t1 = String.fromCharCode(96);
  const blockReg = new RegExp(t3 + '(.*?)<br>([\\s\\S]*?)' + t3, 'g');
  html = html.replace(blockReg, '<pre style="background:#f4f4f4;padding:10px;border-radius:4px;border-left:4px solid #00e5ff;white-space:pre-wrap;">$2</pre>');
  const inlineReg = new RegExp(t1 + '([^' + t1 + ']+)' + t1, 'g');
  html = html.replace(inlineReg, '<code style="background:#f4f4f4;padding:2px 5px;border-radius:3px;font-family:monospace;color:#d63384;">$1</code>');
  html = html.replace(/### (.*?)<br>/g, '<h3>$1</h3>');
  html = html.replace(/## (.*?)<br>/g, '<h2>$1</h2>');
  html = html.replace(/# (.*?)<br>/g, '<h1>$1</h1>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  return html;
}

const toast = (msg, type = "info") => {
  const t = document.createElement("div"); t.className = `toast ${type}`;
  t.innerHTML = `<span>${msg}</span>`; $("#toast-container").appendChild(t);
  setTimeout(() => t.remove(), 3800);
};

const setLocalKey = (n, v) => localStorage.setItem('sysnet_' + n, v);
const getLocalKey = n => localStorage.getItem('sysnet_' + n);

const db = {
  open: () => new Promise((res, rej) => {
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('chats')) e.target.result.createObjectStore('chats', { keyPath:'id' }); };
      req.onsuccess = e => { db.conn = e.target.result; res(); };
      req.onerror = e => rej(e);
    } catch(err) { rej(err); }
  }),
  put: (store, data) => new Promise((res) => { const tx = db.conn.transaction(store, 'readwrite'); tx.objectStore(store).put(data); tx.oncomplete = () => res(); }),
  getAll: (store) => new Promise((res) => { const tx = db.conn.transaction(store, 'readonly'); const req = tx.objectStore(store).getAll(); req.onsuccess = () => res(req.result); }),
  get: (store, id) => new Promise((res) => { const tx = db.conn.transaction(store, 'readonly'); const req = tx.objectStore(store).get(id); req.onsuccess = () => res(req.result); }),
  delete: (store, id) => new Promise((res) => { const tx = db.conn.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => res(); })
};

async function renderArchives() {
  const list = $("#archives-list");
  if (!list) return;
  let chats = await db.getAll('chats') || [];
  chats.sort((a, b) => b.updated - a.updated);

  // Application du filtre de recherche
  if (archiveSearchQuery.trim() !== "") {
    const q = archiveSearchQuery.toLowerCase();
    chats = chats.filter(c => c.messages && c.messages.some(m => m.content && m.content.toLowerCase().includes(q)));
  }

  if (chats.length === 0) {
    list.innerHTML = `<div style='padding:20px;text-align:center;font-size:11px;color:var(--text-dim);'>${archiveSearchQuery ? 'Aucun résultat' : 'Aucun historique'}</div>`;
    return;
  }

  list.innerHTML = chats.map(c => {
    const userMsg = c.messages.find(m => m.role === 'user');
    const title = userMsg ? userMsg.content.substring(0, 35) + "..." : "Nouvelle conversation";
    const date = new Date(c.updated).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    return `
      <div class="archive-item" onclick="loadChat('${c.id}')">
        <div style="flex:1; overflow:hidden;">
          <div class="archive-item-title">${escapeHtml(title)}</div>
          <div class="archive-item-date">${date}</div>
        </div>
        <button class="archive-delete" onclick="event.stopPropagation(); deleteChat('${c.id}')" title="Supprimer">✕</button>
      </div>
    `;
  }).join('');
}

window.loadChat = async (id) => {
  const chat = await db.get('chats', id);
  if (chat) {
    state.chatId = chat.id; state.messages = chat.messages; state.model = chat.model || state.model;
    $("#model-select").value = state.model; renderMessages();
    $("#archives-panel").classList.remove("active");
  }
};

window.deleteChat = async (id) => {
  if (confirm("Supprimer ce cours de l'historique ?")) { await db.delete('chats', id); if (state.chatId === id) newChat(); renderArchives(); }
};

function initFileUpload() {
  const btn = $("#file-upload-btn"); const inp = $("#file-input");
  if (!btn || !inp) return;
  btn.onclick = () => inp.click();
  inp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const isImage = file.type.startsWith('image/');
    const reader = new FileReader();
    reader.onload = (ev) => {
      state.attachedFile = { type: isImage ? 'image' : 'text', data: ev.target.result, name: file.name };
      updateFilePreview();
    };
    isImage ? reader.readAsDataURL(file) : reader.readAsText(file);
    inp.value = '';
  };
}

function updateFilePreview() {
  const bar = $("#file-preview-bar");
  if (!state.attachedFile) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  const icon = state.attachedFile.type === 'image' ? '🖼️' : '📄';
  bar.innerHTML = `<span>${icon} Fichier joint : <strong style="color:var(--cyan)">${state.attachedFile.name}</strong></span><button onclick="clearAttachedFile()" style="color:var(--danger);background:none;border:none;cursor:pointer;">✕ Retirer</button>`;
}
window.clearAttachedFile = () => { state.attachedFile = null; updateFilePreview(); };

// --- NOUVELLES FONCTIONS POUR L'ÉDITEUR ---
window.openEditor = (id) => {
  const msg = state.messages.find(m => m.id === id);
  if (!msg) return;
  const htmlContent = parseMarkdownToHtml(msg.content);
  quillEditor.root.innerHTML = htmlContent;
  $("#editor-modal").classList.add("active");
};

window.exportToWord = () => {
  const htmlContent = quillEditor.root.innerHTML;
  const preHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Support de Cours</title><style>body{font-family:Calibri,sans-serif;font-size:11pt;}h1{color:#2e74b5;font-size:16pt;border-bottom:1px solid #2e74b5;}h2{color:#2e74b5;font-size:14pt;}pre{background:#f2f2f2;border:1px solid #d9d9d9;padding:10px;font-family:Courier New,monospace;white-space:pre-wrap;}code{font-family:Courier New,monospace;background:#f2f2f2;padding:2px 4px;}</style></head><body><h1>Support Pédagogique</h1><div>";
  const postHtml = "</div></body></html>";
  const finalHtml = preHtml + htmlContent + postHtml;

  const blob = new Blob(['\ufeff', finalHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = "Support_Cours_" + now() + ".doc";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast("Fichier Word (.doc) exporté !", "success");
};

window.exportToHtml = () => {
  const htmlContent = quillEditor.root.innerHTML;
  const html = "<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'><title>Cours - SYS-NET STUDIO</title><style>body{font-family:sans-serif;line-height:1.6;color:#333;max-width:800px;margin:40px auto;padding:20px;border:1px solid #eee;}h1,h2{color:#0070a8;}pre{background:#f4f4f4;padding:15px;border-radius:5px;font-family:monospace;white-space:pre-wrap;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:10px;}</style></head><body><h1>Support Pédagogique</h1><div>" + htmlContent + "</div><footer style='margin-top:40px;font-size:0.8em;color:#888;'>Généré par SYS-NET STUDIO</footer></body></html>";
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'})); a.download = "Cours_IT_" + now() + ".html"; a.click();
  toast("Fichier HTML exporté !", "success");
};

function renderMessages() {
  const c = $("#chat-container"); c.innerHTML = '';
  const msgs = (state.messages || []).filter(m => m.role !== 'system');
  if (!msgs.length) {
    c.innerHTML = `<div class="welcome-banner"><div class="wv-logo">SYS-NET STUDIO</div><div class="wv-sub">PRÉPARATION DE SUPPORTS PÉDAGOGIQUES</div><p>Saisissez un concept ou utilisez les boutons rapides ci-dessous.</p></div>`;
    return;
  }
  msgs.forEach(m => {
    const div = document.createElement("div"); div.className = `message ${m.role}`;
    let imgHtml = '';
    if (m.attachedData && m.attachedData.type === 'image') { imgHtml = `<img src="${m.attachedData.data}" style="max-width:100%; border-radius:6px; margin-bottom:12px; border:1px solid var(--wire);">`; }
    
    // Modification : Bouton Éditer & Exporter au lieu de juste HTML
    const action = m.role === 'assistant' ? `<div class="msg-actions"><button class="action-btn" onclick="openEditor('${m.id}')">📝 Éditer & Exporter</button></div>` : '';
    
    div.innerHTML = `<div class="msg-label">${m.role==='user'?'▸ VOUS':'▸ IA STUDIO'}</div>${imgHtml}<div class="message-content">${escapeHtml(m.content || '')}</div>${action}`;
    c.appendChild(div);
  });
  c.scrollTop = c.scrollHeight;
}

window.insertPrompt = (t) => {
  let p = "";
  if(t==='tp') p="Agis comme un expert réseau formateur. Génère un TP de 2h sur [Sujet]. Structure : 1. Contexte, 2. Objectifs, 3. Adressage IP, 4. Configuration, 5. Vérification.";
  if(t==='qcm') p="Crée un QCM de 10 questions sur [Sujet] niveau CCNA. Donne 4 choix, la bonne réponse, et une courte explication.";
  if(t==='config') p="Rédige un script de configuration commenté pour mettre en place : [Sujet].";
  if(t==='cours') p="Agis comme un ingénieur système et réseau expert, formateur pour des étudiants (type BTS SIO SISR). Ton objectif est de rédiger un document de Cours & TP complet, professionnel et structuré sur le sujet suivant : [INSÉRER LE SUJET]. Les technologies principales utilisées seront : [INSÉRER LES TECHNOS].\n\nTu dois impérativement générer le contenu en respectant la structure et le formatage exacts ci-dessous. Pour simuler la pagination, insère le marqueur \"--- PAGE [Numéro] ---\" en bas de chaque section logique.\n\n1. PAGE DE GARDE\n2. TABLE DES MATIÈRES\n3. INTRODUCTION\n4. PARTIE PRATIQUE (LE TP)\n5. DÉPANNAGE (TROUBLESHOOTING)\n6. CONCLUSION\n7. RESSOURCES ET SOURCES";
  $("#user-input").value = p; $("#user-input").focus();
};

async function saveChat() { if (state.chatId) { await db.put('chats', { id: state.chatId, model: state.model, messages: state.messages, updated: now() }); renderArchives(); } }

window.newChat = async () => {
  state.chatId = uuid(); state.messages = [{ role:"system", content:"Tu es un assistant expert en Ingénierie Système et Réseau, spécialisé dans la pédagogie." }];
  await saveChat(); renderMessages(); $("#archives-panel").classList.remove("active");
};

async function sendMessage() {
  const txt = $("#user-input").value.trim(); 
  if (!txt && !state.attachedFile) return; 
  if (!state.apiKey) { $("#api-modal").classList.add("active"); return; }
  
  const mid = uuid();
  let uiMessage = txt;
  let apiPrompt = txt;

  if (state.attachedFile && state.attachedFile.type === 'text') {
    const t3 = String.fromCharCode(96, 96, 96);
    apiPrompt = 'Fichier "' + state.attachedFile.name + '":\n' + t3 + '\n' + state.attachedFile.data + '\n' + t3 + '\n' + txt;
    uiMessage = txt || 'Fichier : ' + state.attachedFile.name;
  } else if (state.attachedFile && state.attachedFile.type === 'image' && !txt) {
    uiMessage = "Analyse de cette image :";
    apiPrompt = "Décris cette image en détail.";
  }

  const attachedData = state.attachedFile && state.attachedFile.type === 'image' ? { ...state.attachedFile } : null;

  state.messages.push({ id: mid, role: "user", content: uiMessage, apiContent: apiPrompt, attachedData: attachedData, ts: now() });
  renderMessages(); $("#user-input").value = ""; $("#send-btn").disabled = true;

  const apiMessages = state.messages.map(m => {
    if (m.role === "user" && m.attachedData && m.attachedData.type === 'image') {
       return { role: "user", content: [ { type: "text", text: m.apiContent || m.content }, { type: "image_url", image_url: m.attachedData.data } ] };
    }
    return { role: m.role, content: m.apiContent || m.content };
  });

  state.attachedFile = null; updateFilePreview();

  try {
    const res = await fetch("https://api.mistral.ai/v1/chat/completions", {
      method: "POST", headers: { "Authorization": `Bearer ${state.apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model: state.model, messages: apiMessages })
    });
    if(!res.ok) throw new Error("Erreur de l'API");
    const data = await res.json();
    state.messages.push({ id: uuid(), role: "assistant", content: data.choices[0].message.content, ts: now() });
    renderMessages(); await saveChat();
  } catch (e) { toast("Erreur de connexion à l'IA.", "error"); } finally { $("#send-btn").disabled = false; }
}

document.addEventListener('DOMContentLoaded', async () => {
  try { await db.open(); } catch(e) { toast("Erreur de base de données.", "error"); }
  
  const sel = $("#model-select"); MODELS.forEach(m => { const opt = document.createElement("option"); opt.value = m.id; opt.textContent = m.name; sel.appendChild(opt); });
  sel.onchange = e => state.model = e.target.value;
  
  const key = getLocalKey("api_key"); 
  if (key && key.length > 10) { 
    state.apiKey = key; $("#api-status").innerHTML = 'ONLINE'; $("#api-status").className = "status-pill active"; 
  }
  
  // Initialisation sécurisée de l'éditeur Quill
  quillEditor = new Quill('#editor-container', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['code-block', 'clean']
      ]
    },
    placeholder: 'Le contenu du cours apparaîtra ici...'
  });
  
  initFileUpload();
  await renderArchives(); 
  await newChat();
  
  $("#send-btn").onclick = sendMessage;
  $("#user-input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  $("#clear-chat").onclick = newChat;
  
  $("#archives-btn").onclick = () => { $("#archives-panel").classList.toggle("active"); };
  
  // Raccordement sécurisé de la recherche
  const searchInput = $("#archives-search-input");
  const searchBtn = $("#btn-search-archive");
  const triggerSearch = () => { archiveSearchQuery = searchInput.value; renderArchives(); };
  
  if (searchInput) searchInput.addEventListener('input', triggerSearch);
  if (searchBtn) searchBtn.addEventListener('click', triggerSearch);
  
  $("#open-api-modal").onclick = () => $("#api-modal").classList.add("active");
  $("#close-api-modal").onclick = () => $("#api-modal").classList.remove("active");
  $("#close-editor-modal").onclick = () => $("#editor-modal").classList.remove("active");
  
  $("#save-api-key").onclick = () => { 
    const k = $("#api-key-input").value.trim(); 
    if(k.length > 10) {
      setLocalKey("api_key", k); 
      state.apiKey = k; 
      $("#api-status").innerHTML = 'ONLINE'; 
      $("#api-status").className = "status-pill active";
      $("#api-modal").classList.remove("active");
      toast("Clé API enregistrée !", "success");
    } else {
      toast("Clé invalide.", "error");
    }
  };
});
</script>
