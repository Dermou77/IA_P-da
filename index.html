<!DOCTYPE html>
<html lang="fr" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SYS-NET STUDIO — Formateur IT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════
   VOANH DESIGN SYSTEM — CYBER / 2ADVANCED
   ═══════════════════════════════════════════ */
:root {
  --void: #020509;
  --deep: #050d18;
  --hull: #091525;
  --plate: #0d1e33;
  --grid: #122540;
  --wire: #1a3455;
  --cyan: #00e5ff;
  --cyan-dim: rgba(0, 229, 255, 0.15);
  --cyan-glow: rgba(0, 229, 255, 0.35);
  --neon: #00ff9d;
  --neon-dim: rgba(0, 255, 157, 0.12);
  --plasma: #ff6b35;
  --plasma-dim: rgba(255, 107, 53, 0.15);
  --violet: #7c3aed;
  --violet-dim: rgba(124, 58, 237, 0.2);
  --gold: #f59e0b;
  --text: #b8d4f0;
  --text-bright: #e8f4ff;
  --text-dim: #4a6b8a;
  --text-code: #00e5ff;
  --danger: #ff3366;
  --success: #00ff9d;
  --warning: #f59e0b;
  --font-display: 'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif;
  --r: 6px;
  --r-lg: 12px;
  --border: 1px solid var(--wire);
  --border-cyan: 1px solid rgba(0,229,255,0.3);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  --scanline: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.015) 2px, rgba(0,229,255,0.015) 4px);
  --hud-border: 1px solid rgba(0,229,255,0.2);
}

/* RESET */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--wire); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

/* GLOBAL */
html, body {
  height: 100%;
  overflow: hidden;
}
body {
  font-family: var(--font-body);
  background: var(--void);
  color: var(--text);
  display: flex;
  flex-direction: column;
  background-image:
    var(--scanline),
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,229,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 90% 80%, rgba(124,58,237,0.04) 0%, transparent 50%);
}

/* ═══ GRID BACKGROUND ═══ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ═══ HEADER ═══ */
#voanh-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5, 13, 24, 0.95);
  border-bottom: var(--hud-border);
  backdrop-filter: blur(20px);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(0,229,255,0.1), 0 4px 30px rgba(0,0,0,0.5);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.brand-logo {
  width: 36px;
  height: 36px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-logo svg {
  width: 36px;
  height: 36px;
  filter: drop-shadow(0 0 6px rgba(0,229,255,0.8));
}
.brand-name {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--text-bright);
  text-shadow: 0 0 20px rgba(0,229,255,0.5);
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-top: 2px;
  opacity: 0.7;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  flex-wrap: nowrap;
  overflow: hidden;
  min-width: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ═══ HUD ELEMENTS ═══ */
.hud-select {
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 10px;
  border-radius: var(--r);
  cursor: pointer;
  transition: var(--transition);
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  min-width: 0;
}
.hud-select:hover, .hud-select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 10px var(--cyan-dim), inset 0 0 10px rgba(0,229,255,0.03);
  color: var(--text-bright);
}
#model-select { max-width: 180px; }
#agent-select { max-width: 160px; }

.hud-btn {
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 12px;
  border-radius: var(--r);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.hud-btn:hover {
  background: var(--plate);
  border-color: rgba(0,229,255,0.5);
  color: var(--cyan);
  box-shadow: 0 0 10px var(--cyan-dim);
}
.hud-btn.primary {
  background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,255,157,0.08));
  border-color: rgba(0,229,255,0.5);
  color: var(--cyan);
  font-weight: 600;
}
.hud-btn.primary:hover {
  background: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(0,255,157,0.15));
  box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 10px rgba(0,229,255,0.05);
}
.hud-btn.danger { border-color: rgba(255,51,102,0.4); color: var(--danger); }
.hud-btn.danger:hover { box-shadow: 0 0 10px rgba(255,51,102,0.3); }
.hud-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 5px 10px;
  border-radius: 20px;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.status-pill.active {
  border-color: rgba(0,255,157,0.4);
  color: var(--neon);
  background: var(--neon-dim);
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.status-pill.active .status-dot {
  animation: pulse-dot 1.5s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px currentColor; }
  50% { opacity: 0.4; box-shadow: none; }
}

/* ═══ CHAT AREA ═══ */
#chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  z-index: 1;
  min-height: 0;
}

/* ═══ MESSAGES ═══ */
.message {
  max-width: 82%;
  padding: 14px 18px;
  border-radius: var(--r-lg);
  line-height: 1.65;
  position: relative;
  animation: msgIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(0,255,157,0.06));
  border: var(--border-cyan);
  border-bottom-right-radius: 3px;
  color: var(--text-bright);
  box-shadow: 0 4px 20px rgba(0,229,255,0.1);
}
.message.user::before {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, transparent 60%, rgba(0,229,255,0.05));
  pointer-events: none;
}

.message.assistant {
  align-self: flex-start;
  background: var(--hull);
  border: var(--border);
  border-bottom-left-radius: 3px;
  border-left: 2px solid rgba(0,229,255,0.3);
}

.message.system {
  align-self: center;
  max-width: 90%;
  background: transparent;
  border: 1px dashed var(--wire);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  padding: 8px 14px;
  border-radius: 20px;
}

.msg-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.message.user .msg-label { color: rgba(0,229,255,0.5); }

.message-content {
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 14px;
}

.msg-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--wire);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mem-tag {
  font-size: 9px;
  background: rgba(124,58,237,0.2);
  border: 1px solid rgba(124,58,237,0.4);
  color: #a78bfa;
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: 1px;
}

/* ═══ TYPING INDICATOR ═══ */
.typing-indicator {
  align-self: flex-start;
  background: var(--hull);
  border: var(--border);
  border-left: 2px solid rgba(0,229,255,0.3);
  padding: 14px 18px;
  border-radius: var(--r-lg);
  border-bottom-left-radius: 3px;
  display: flex;
  align-items: center;
  gap: 5px;
  animation: msgIn 0.25s ease;
}
.typing-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  animation: typingBounce 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-5px); opacity: 1; }
}

/* ═══ QUICK PROMPTS (SYS&NET) ═══ */
#quick-prompts {
  background: rgba(5,13,24,0.95);
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  border-top: var(--hud-border);
  flex-shrink: 0;
  backdrop-filter: blur(20px);
}
.quick-btn {
  background: var(--hull);
  border: 1px solid var(--wire);
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 12px;
  border-radius: var(--r);
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.quick-btn:hover {
  border-color: var(--cyan);
  background: var(--cyan-dim);
  box-shadow: 0 0 10px var(--cyan-dim);
}

/* ═══ INPUT AREA ═══ */
#input-area {
  background: rgba(5,13,24,0.95);
  border-top: 1px solid rgba(0,229,255,0.1);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
  backdrop-filter: blur(20px);
  box-shadow: 0 -1px 0 rgba(0,229,255,0.08);
}
#user-input {
  flex: 1;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text-bright);
  font-family: var(--font-body);
  font-size: 14px;
  padding: 12px 16px;
  border-radius: var(--r-lg);
  resize: none;
  min-height: 46px;
  max-height: 160px;
  line-height: 1.5;
  transition: var(--transition);
  outline: none;
}
#user-input::placeholder { color: var(--text-dim); }
#user-input:focus {
  border-color: rgba(0,229,255,0.5);
  box-shadow: 0 0 15px var(--cyan-dim), inset 0 0 15px rgba(0,229,255,0.02);
}
#send-btn {
  background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(0,255,157,0.1));
  border: var(--border-cyan);
  color: var(--cyan);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  padding: 12px 20px;
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  letter-spacing: 1px;
  flex-shrink: 0;
  align-self: flex-end;
}
#send-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(0,229,255,0.3), rgba(0,255,157,0.2));
  box-shadow: 0 0 20px var(--cyan-glow);
  transform: translateY(-1px);
}
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ═══ MEMORY PANEL ═══ */
#memory-toggle {
  position: fixed;
  right: 16px;
  bottom: 125px;
  z-index: 200;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--cyan);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 15px var(--cyan-dim);
  transition: var(--transition);
}
#memory-toggle:hover {
  box-shadow: 0 0 25px var(--cyan-glow);
  border-color: var(--cyan);
}

#memory-panel {
  position: fixed;
  right: 16px;
  bottom: 175px;
  width: 300px;
  background: rgba(9,21,37,0.97);
  border: var(--hud-border);
  border-radius: var(--r-lg);
  padding: 16px;
  z-index: 199;
  box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 20px var(--cyan-dim);
  transform: translateX(calc(100% + 20px));
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter: blur(20px);
}
#memory-panel.active { transform: translateX(0); }
.memory-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: var(--border);
}
.memory-header h3 {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--cyan);
}
.memory-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
.memory-item {
  padding: 7px 0;
  border-bottom: 1px solid var(--grid);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.memory-item:last-child { border-bottom: none; }
.memory-item .content { flex: 1; color: var(--text); font-family: var(--font-mono); font-size: 11px; line-height: 1.4; }
.memory-item .actions button {
  padding: 2px 6px;
  font-size: 10px;
  background: transparent;
  border: 1px solid var(--wire);
  color: var(--danger);
  border-radius: 3px;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font-mono);
}
.memory-item .actions button:hover { border-color: var(--danger); background: rgba(255,51,102,0.1); }
.memory-input {
  display: flex;
  gap: 7px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: var(--border);
}
.memory-input input {
  flex: 1;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 7px 10px;
  border-radius: var(--r);
  outline: none;
}
.memory-input input:focus { border-color: var(--cyan); }
.memory-input button {
  background: rgba(0,229,255,0.1);
  border: var(--border-cyan);
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 7px 12px;
  border-radius: var(--r);
  cursor: pointer;
  transition: var(--transition);
}
.memory-input button:hover { background: rgba(0,229,255,0.2); }

/* ═══ ARCHIVES PANEL ═══ */
#archives-btn {
  position: fixed;
  left: 16px;
  bottom: 125px;
  z-index: 200;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--cyan);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 15px var(--cyan-dim);
  transition: var(--transition);
}
#archives-btn:hover { box-shadow: 0 0 25px var(--cyan-glow); border-color: var(--cyan); }
#archives-panel {
  position: fixed;
  left: 16px;
  bottom: 175px;
  width: 290px;
  background: rgba(9,21,37,0.97);
  border: var(--hud-border);
  border-radius: var(--r-lg);
  z-index: 199;
  box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 20px var(--cyan-dim);
  transform: translateX(calc(-100% - 20px));
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  max-height: 70vh;
}
#archives-panel.active { transform: translateX(0); }
.archives-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: var(--border);
  flex-shrink: 0;
}
.archives-header h3 { font-family: var(--font-display); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); }
.archives-search { padding: 8px 10px; border-bottom: var(--border); flex-shrink: 0; }
.archives-search input {
  width: 100%;
  background: var(--hull);
  border: var(--hud-border);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 10px;
  border-radius: var(--r);
  outline: none;
}
.archives-search input:focus { border-color: var(--cyan); }
.archives-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.archive-item {
  padding: 9px 12px;
  cursor: pointer;
  transition: var(--transition);
  border-bottom: 1px solid var(--grid);
  display: flex;
  align-items: flex-start;
  gap: 7px;
}
.archive-item:last-child { border-bottom: none; }
.archive-item:hover { background: var(--hull); }
.archive-item.active-chat { border-left: 2px solid var(--cyan); background: var(--cyan-dim); }
.archive-item-icon { color: var(--cyan); font-size: 11px; flex-shrink: 0; margin-top: 2px; opacity: 0.6; }
.archive-item-content { flex: 1; min-width: 0; }
.archive-item-title { font-family: var(--font-mono); font-size: 11px; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.archive-item-meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); display: flex; gap: 8px; }
.archive-item-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 4px; font-size: 10px; border-radius: 3px; transition: var(--transition); flex-shrink: 0; }
.archive-item-del:hover { color: var(--danger); }
.archive-fav-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 2px; flex-shrink: 0; }
.archive-fav-btn.fav { color: var(--gold); }
.archive-empty { padding: 20px 14px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }

/* ═══ MESSAGE ACTIONS ═══ */
.msg-actions { display: none; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.message:hover .msg-actions { display: flex; }
.msg-action-btn { background: transparent; border: 1px solid var(--wire); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; padding: 2px 7px; border-radius: 3px; cursor: pointer; transition: var(--transition); letter-spacing: 0.5px; }
.msg-action-btn:hover { border-color: var(--cyan); color: var(--cyan); }

/* ═══ VOICE BUTTON ═══ */
#voice-btn { background: var(--hull); border: var(--hud-border); color: var(--text-dim); font-size: 16px; width: 46px; height: 46px; border-radius: var(--r-lg); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: flex-end; }
#voice-btn:hover { border-color: var(--cyan); color: var(--cyan); }
#voice-btn.recording { border-color: var(--danger); color: var(--danger); animation: pulse-border 1s infinite; background: rgba(255,51,102,0.1); }
@keyframes pulse-border { 0%,100%{box-shadow:0 0 0 0 rgba(255,51,102,0.4)}50%{box-shadow:0 0 0 6px rgba(255,51,102,0)} }

/* ═══ SCROLL TO BOTTOM ═══ */
#scroll-bottom { position: fixed; right: 68px; bottom: 125px; z-index: 200; width: 34px; height: 34px; border-radius: 50%; background: var(--hull); border: var(--hud-border); color: var(--cyan); font-size: 14px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: var(--transition); }
#scroll-bottom.visible { display: flex; }
#scroll-bottom:hover { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan-glow); }

/* ═══ MODALS & FORM ELEMENTS (Simplified for space) ═══ */
.modal-overlay { position: fixed; inset: 0; background: rgba(2,5,9,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; backdrop-filter: blur(8px); }
.modal-overlay.active { display: flex; animation: overlayIn 0.2s ease; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box { background: var(--deep); border: var(--hud-border); border-radius: var(--r-lg); width: 100%; max-width: 640px; max-height: 90dvh; overflow-y: auto; box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 30px var(--cyan-dim); animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { padding: 20px 24px 16px; border-bottom: var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--deep); z-index: 10; }
.modal-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 3px; color: var(--cyan); display: flex; align-items: center; gap: 10px; }
.modal-close { background: transparent; border: 1px solid var(--wire); color: var(--text-dim); width: 28px; height: 28px; border-radius: var(--r); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: var(--transition); font-family: var(--font-mono); }
.modal-close:hover { border-color: var(--danger); color: var(--danger); }
.modal-body { padding: 20px 24px 24px; }
.field-group { margin-bottom: 18px; }
.field-label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--cyan); margin-bottom: 8px; opacity: 0.8; }
.field-input, .field-textarea, .field-select { width: 100%; background: var(--hull); border: var(--hud-border); color: var(--text-bright); font-family: var(--font-body); font-size: 13px; padding: 11px 14px; border-radius: var(--r); outline: none; transition: var(--transition); appearance: none; }
.field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan-dim); }
.field-input::placeholder, .field-textarea::placeholder { color: var(--text-dim); }
.field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.field-hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 5px; letter-spacing: 0.5px; }
.btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: var(--border); }
.btn-primary { background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(0,255,157,0.1)); border: var(--border-cyan); color: var(--cyan); font-family: var(--font-display); font-size: 11px; font-weight: 700; padding: 10px 20px; border-radius: var(--r); cursor: pointer; transition: var(--transition); letter-spacing: 2px; text-transform: uppercase; }
.btn-primary:hover { background: linear-gradient(135deg, rgba(0,229,255,0.3), rgba(0,255,157,0.2)); box-shadow: 0 0 20px var(--cyan-glow); }
.btn-ghost { background: transparent; border: 1px solid var(--wire); color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; padding: 10px 16px; border-radius: var(--r); cursor: pointer; transition: var(--transition); letter-spacing: 1px; }
.btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

/* ═══ TOAST ═══ */
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--deep); border: var(--hud-border); color: var(--text); padding: 11px 16px; border-radius: var(--r); box-shadow: 0 8px 30px rgba(0,0,0,0.5); font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; gap: 8px; animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1); max-width: 340px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px) scale(0.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
.toast.success { border-left: 2px solid var(--neon); }
.toast.error { border-left: 2px solid var(--danger); }

/* ═══ DATA GRID ═══ */
.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.data-card { background: var(--hull); border: var(--border); border-radius: var(--r); padding: 12px 14px; text-align: center; }
.data-card-value { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--cyan); line-height: 1; margin-bottom: 4px; }
.data-card-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }

/* ═══ WELCOME MESSAGE HEADER AREA ═══ */
.welcome-banner { align-self: center; text-align: center; padding: 28px 20px; max-width: 550px; }
.welcome-banner .wv-logo { font-family: var(--font-display); font-size: 40px; font-weight: 900; letter-spacing: 8px; color: var(--text-bright); text-shadow: 0 0 30px rgba(0,229,255,0.4); margin-bottom: 8px; }
.welcome-banner .wv-sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 4px; color: var(--cyan); opacity: 0.7; margin-bottom: 20px; }
.welcome-banner p { font-size: 13px; color: var(--text-dim); line-height: 1.7; }

/* ═══ CONTEXT METER ═══ */
.context-meter { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--hull); border: var(--hud-border); border-radius: var(--r); font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
.context-bar-track { width: 40px; height: 4px; background: var(--wire); border-radius: 2px; overflow: hidden; }
.context-bar-fill { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.3s; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 768px) {
  #voanh-header { padding: 0 12px; gap: 10px; }
  .brand-name { font-size: 15px; letter-spacing: 3px; }
  .brand-sub { display: none; }
  .header-controls { display: none; }
  .header-right { display: none; }
  #burger-btn { display: flex; }
  #chat-container { padding: 14px 12px; }
  .message { max-width: 95%; }
  #input-area { padding: 8px 10px; gap: 7px; }
  #quick-prompts { padding: 8px 10px; }
}
</style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header id="voanh-header">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="18,2 34,12 34,24 18,34 2,24 2,12" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.6"/>
        <circle cx="18" cy="18" r="4" fill="#00e5ff" opacity="0.9"/>
      </svg>
    </div>
    <div>
      <div class="brand-name" id="main-brand-name">SYS-NET STUDIO</div>
      <div class="brand-sub">IT TRAINER PLATFORM v1.0</div>
    </div>
  </div>

  <div class="header-controls">
    <select class="hud-select" id="model-select"></select>
    <select class="hud-select" id="agent-select">
      <option value="">▸ NO AGENT</option>
    </select>
    <button class="hud-btn" id="clear-chat">⌫ CLEAR</button>
    <button class="hud-btn" id="new-chat">+ NEW</button>
    <button class="hud-btn" id="open-archives-desktop">⬡ ARCHIVES</button>
    <div class="context-meter" id="context-meter" title="Contexte utilisé"><div class="context-bar-track"><div class="context-bar-fill" id="context-bar" style="width:0%"></div></div><span id="context-label">0%</span></div>
  </div>

  <div class="header-right">
    <span class="status-pill" id="api-status"><span class="status-dot"></span>OFFLINE</span>
    <button class="hud-btn primary" id="open-api-modal">⬡ API KEY</button>
    <button class="hud-btn" id="open-agent-modal">⚙ AGENT</button>
    <button class="hud-btn" id="open-data-modal">⬡ DATA</button>
  </div>
</header>

<!-- ═══════════════════ CHAT ═══════════════════ -->
<main id="chat-container"></main>

<!-- ═══════════════════ QUICK PROMPTS ═══════════════════ -->
<div id="quick-prompts">
  <button class="quick-btn" onclick="insertPrompt('tp')">⚡ TP Complet (Architecture)</button>
  <button class="quick-btn" onclick="insertPrompt('qcm')">📝 Générer QCM CCNA</button>
  <button class="quick-btn" onclick="insertPrompt('config')">⚙️ Script Config (Cisco/Linux)</button>
  <button class="quick-btn" onclick="insertPrompt('vulga')">🎓 Vulgariser un concept</button>
  <button class="quick-btn" onclick="insertPrompt('mermaid')">📊 Topologie (Mermaid.js)</button>
</div>

<!-- ═══════════════════ INPUT ═══════════════════ -->
<div id="input-area" style="position:relative">
  <button id="voice-btn" title="Dictée vocale">🎤</button>
  <button id="file-upload-btn" title="Joindre un fichier/image/audio" style="background:var(--hull);border:var(--hud-border);color:var(--text-dim);font-size:16px;width:46px;height:46px;border-radius:var(--r-lg);cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end">📎</button>
  <input type="file" id="file-input" accept="image/*,audio/*,.pdf" style="display:none">
  <textarea id="user-input" placeholder="Transmettez votre message… (Entrée pour envoyer)" rows="1"></textarea>
  <button id="send-btn">SEND ▶</button>
</div>

<!-- ═══════════════════ ARCHIVES & MEMORY (Hidden Panels) ═══════════════════ -->
<button id="archives-btn" title="Archives des conversations">⬡</button>
<div id="archives-panel">
  <div class="archives-header">
    <h3>⬡ ARCHIVES</h3>
    <button class="btn-ghost" id="archives-new-btn" style="padding:3px 8px;font-size:9px;border-radius:3px;letter-spacing:1px">+ NOUVEAU</button>
  </div>
  <div class="archives-list" id="archives-list"></div>
</div>
<button id="scroll-bottom" title="Descendre">↓</button>

<button id="memory-toggle" title="Mémoire Globale">⬡</button>
<div id="memory-panel">
  <div class="memory-header">
    <h3>⬡ MÉMOIRE GLOBALE</h3>
    <button class="btn-ghost" id="memory-clear" style="padding:3px 8px;font-size:10px;border-radius:3px">EFFACER</button>
  </div>
  <div class="memory-list" id="memory-list"></div>
  <div class="memory-input">
    <input type="text" id="memory-input" placeholder="Ajouter à la mémoire…">
    <button id="memory-add">+</button>
  </div>
</div>

<!-- ═══════════════════ MODAL : API KEY ═══════════════════ -->
<div class="modal-overlay" id="api-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">⬡ ACTIVATION API MISTRAL</div>
      <button class="modal-close" id="close-api-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">🔑 Clé API Mistral</label>
        <input type="password" class="field-input" id="api-key-input" placeholder="Collez votre clé ici…">
      </div>
      <div class="btn-row">
        <button class="btn-ghost" id="delete-api-key" style="border-color:rgba(255,51,102,0.3);color:var(--danger)">🗑 SUPPRIMER</button>
        <button class="btn-primary" id="save-api-key">💾 ENREGISTRER</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ MODAL : DATA ═══════════════════ -->
<div class="modal-overlay" id="data-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">⬡ GESTION DES DONNÉES</div>
      <button class="modal-close" id="close-data-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="data-grid" id="data-stats">
        <div class="data-card"><div class="data-card-value" id="stat-chats">—</div><div class="data-card-label">Conversations</div></div>
        <div class="data-card"><div class="data-card-value" id="stat-agents">—</div><div class="data-card-label">Agents</div></div>
      </div>
      <button class="btn-primary" id="btn-export" style="width:100%;margin-bottom:12px;">⬇ TÉLÉCHARGER TOUTES LES DONNÉES</button>
      <button class="btn-ghost" id="btn-clear-all" style="width:100%;border-color:rgba(255,51,102,0.3);color:var(--danger)">⚠ SUPPRIMER TOUTES LES DONNÉES LOCALES</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- ═══════════════════════════════════════════
  JAVASCRIPT
═══════════════════════════════════════════ -->
<script>
// CONFIG & MODELS
const MODELS = [
  { id:"mistral-large-2512", name:"🔥 Mistral Large", tokens:50000, temp:0.42 },
  { id:"codestral-2508", name:"💻 Codestral (Scripts)", tokens:50000, temp:0.48 },
  { id:"mistral-small-2506", name:"⚡ Mistral Small", tokens:50000, temp:0.42 }
];

const DB_NAME = "VOANH_AI_DB";
const DB_VERSION = 3;
let state = { apiKey: null, chatId: null, messages: [], agent: null, model: "mistral-large-2512", globalMemories: [] };

// UTILS
const $ = s => document.querySelector(s);
const uuid = () => crypto.randomUUID();
const now = () => Date.now();
const escapeHtml = t => (t||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");

const toast = (msg, type = "info") => {
  const t = document.createElement("div"); t.className = `toast ${type}`;
  t.innerHTML = `<span>${msg}</span>`; $("#toast-container").appendChild(t);
  setTimeout(() => t.remove(), 3800);
};

const setCookie = (n, v, d = 365) => { localStorage.setItem('voanh_' + n, v); };
const getCookie = n => localStorage.getItem('voanh_' + n);
const deleteCookie = n => localStorage.removeItem('voanh_' + n);
const isValidApiKey = k => k.trim().length >= 20;

// INDEXED DB
const db = {
  open: () => new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      ['chats','agents','settings','global_memory'].forEach(s => {
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:'id' });
      });
    };
    req.onsuccess = e => { db.conn = e.target.result; res(db.conn); };
  }),
  put: (store, data) => new Promise((res) => { const tx = db.conn.transaction(store, 'readwrite'); tx.objectStore(store).put(data); tx.oncomplete = () => res(); }),
  get: (store, id) => new Promise((res) => { const tx = db.conn.transaction(store, 'readonly'); const r = tx.objectStore(store).get(id); r.onsuccess = () => res(r.result); }),
  getAll: store => new Promise((res) => { const tx = db.conn.transaction(store, 'readonly'); const r = tx.objectStore(store).getAll(); r.onsuccess = () => res(r.result); }),
  delete: (store, id) => new Promise((res) => { const tx = db.conn.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => res(); })
};

// CHAT RENDERING
function renderMessages() {
  const c = $("#chat-container");
  const msgs = (state.messages || []).filter(m => m.role !== 'system');

  if (!msgs.length) {
    c.innerHTML = `
      <div class="welcome-banner">
        <div class="wv-logo">SYS-NET STUDIO</div>
        <div class="wv-sub">ASSISTANT PÉDAGOGIQUE IT</div>
        <p>Bienvenue dans votre espace de création de cours. Utilisez les boutons <strong>Quick Prompts</strong> en bas pour générer instantanément des TPs, des QCMs ou des configurations réseaux.</p>
      </div>`;
    return;
  }

  c.innerHTML = '';
  msgs.forEach(m => {
    const div = document.createElement("div");
    div.className = `message ${m.role}`;
    const label = m.role === 'user' ? '▸ VOUS' : '▸ IA';
    div.innerHTML = `<div class="msg-label">${label}</div><div class="message-content">${escapeHtml(m.content || '')}</div>`;
    c.appendChild(div);
  });
  c.scrollTop = c.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div"); div.className = "typing-indicator"; div.id = "typing-indicator";
  div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  $("#chat-container").appendChild(div); $("#chat-container").scrollTop = $("#chat-container").scrollHeight;
}
function hideTyping() { const t = $("#typing-indicator"); if (t) t.remove(); }

// ════════════════════════════════════════
// QUICK PROMPTS SYSTEM & NETWORK
// ════════════════════════════════════════
window.insertPrompt = (type) => {
  const input = document.getElementById('user-input');
  let prompt = "";
  switch(type) {
    case 'tp':
      prompt = "Agis comme un expert réseau formateur. Génère un TP de 2h sur [Sujet]. Structure attendue :\n1. Contexte de l'entreprise\n2. Objectifs pédagogiques\n3. Tableau d'adressage IP (sous-réseaux)\n4. Étapes de configuration pas à pas\n5. Commandes de vérification.";
      break;
    case 'qcm':
      prompt = "Crée un QCM de 10 questions sur [Sujet] niveau CCNA/BTS SIO. Pour chaque question, donne 4 choix, indique la bonne réponse, et ajoute une courte explication technique de 2 lignes.";
      break;
    case 'config':
      prompt = "Rédige un script de configuration [Bash / Cisco IOS / PowerShell] commenté ligne par ligne pour mettre en place : [Sujet]. Ajoute les commandes de test (ping, show, etc.) à la fin.";
      break;
    case 'vulga':
      prompt = "Explique le concept ou protocole [Sujet] en utilisant une analogie simple de la vie de tous les jours. Cible : étudiants débutants (Bac pro / 1ère année). Termine par les 3 termes techniques clés à retenir.";
      break;
    case 'mermaid':
      prompt = "Génère le code Mermaid.js (type graph TD ou flowchart) pour illustrer la topologie réseau suivante : [Sujet]. Utilise des icônes ou des formes adaptées pour les routeurs, switchs et serveurs.";
      break;
  }
  input.value = prompt;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  input.focus();
  
  // Auto-selection of "[Sujet]"
  const startPos = prompt.indexOf('[Sujet]');
  if(startPos !== -1) {
    input.setSelectionRange(startPos, startPos + 7);
  }
};

// SYSTEM & SEND
function buildSystemPrompt() {
  return "Tu es un assistant expert en Ingénierie Système et Réseau, spécialisé dans la pédagogie. Tes réponses doivent être précises, techniques, structurées et adaptées pour des étudiants en informatique.";
}

async function saveChat() {
  if (!state.chatId) return;
  await db.put('chats', { id: state.chatId, model: state.model, messages: state.messages, updated: now() });
}

async function newChat() {
  state.chatId = uuid();
  state.messages = [{ role:"system", content:buildSystemPrompt(), ts:now() }];
  await saveChat(); renderMessages();
}

async function sendMessage() {
  const txt = $("#user-input").value.trim();
  if (!txt) return;
  if (!state.apiKey) { $("#api-modal").classList.add("active"); return; }

  state.messages.push({ role:"user", content:txt, ts:now() });
  renderMessages(); $("#user-input").value = ""; $("#send-btn").disabled = true; showTyping();

  try {
    const res = await fetch("https://api.mistral.ai/v1/chat/completions", {
      method: "POST", headers: { "Authorization": `Bearer ${state.apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model: state.model, messages: state.messages.map(m=>({role:m.role, content:m.content})) })
    });
    if (!res.ok) throw new Error("API Error");
    const data = await res.json();
    hideTyping();
    state.messages.push({ role:"assistant", content:data.choices[0].message.content, ts:now() });
    renderMessages(); await saveChat();
  } catch (e) {
    hideTyping(); toast("Erreur lors de l'envoi", "error");
  } finally { $("#send-btn").disabled = false; }
}

// INIT
document.addEventListener('DOMContentLoaded', async () => {
  await db.open();
  const modelSel = $("#model-select");
  MODELS.forEach(m => {
    const opt = document.createElement("option"); opt.value = m.id; opt.textContent = m.name; modelSel.appendChild(opt);
  });
  const key = getCookie("mistral_api_key");
  if (key && isValidApiKey(key)) {
    state.apiKey = key; $("#api-status").innerHTML = 'ONLINE'; $("#api-status").className = "status-pill active";
  }
  await newChat();

  $("#send-btn").onclick = sendMessage;
  $("#user-input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  $("#clear-chat").onclick = newChat;
  
  $("#open-api-modal").onclick = () => $("#api-modal").classList.add("active");
  $("#close-api-modal").onclick = () => $("#api-modal").classList.remove("active");
  
  $("#save-api-key").onclick = () => {
    const k = $("#api-key-input").value.trim();
    if (isValidApiKey(k)) {
      setCookie("mistral_api_key", k); state.apiKey = k;
      $("#api-status").innerHTML = 'ONLINE'; $("#api-status").className = "status-pill active";
      $("#api-modal").classList.remove("active"); toast("Clé API enregistrée", "success");
    }
  };
});
</script>
</body>
</html>
